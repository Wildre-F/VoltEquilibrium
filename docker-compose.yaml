services:
  postgres:
    image: postgres:17
    container_name: green-energy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: green_energy
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  mqtt:
    image: eclipse-mosquitto:2
    container_name: green-energy-mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  # Ollama AI — runs on CPU by default
  # For GPU: install NVIDIA Container Toolkit, then uncomment the deploy block below
  ollama:
    image: ollama/ollama:latest
    container_name: green-energy-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  backend:
    image: node:24-alpine
    container_name: green-energy-backend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c "npm install && node app.js"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - mqtt
      - ollama

volumes:
  postgres_data:
  ollama_data: